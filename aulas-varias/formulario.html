<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    

<div class="w-full max-w-4xl mx-auto mt-16 border p-8">
    <p class="text-3xl mb-4">Formulário de XXX</p>

    <form action="#" method="get">

    <div class="flex flex-col">
        <label for="nome">Nome Próprio *</label>
        <input class="peer p-2 border" type="text" name="nome" id="nome"
            required minlength="5"
            placeholder="Introduza o seu nome"
        >
        <small class=" invisible peer-user-invalid:visible  text-red-600">Mínimo de 5 carateres.</small>
    </div>




    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="flex flex-col">
            <label for="email">Email</label>
            <input class="peer p-2 border" type="email" name="email" id="email"
                placeholder="ex: nome@exemplo.com">
            <small class=" invisible peer-user-invalid:visible  text-red-600">Formato inválido.</small>
        </div>
        
        <div class="flex flex-col">
            <label for="telele">Telefone</label>
            <input class="peer p-2 border" type="tel" name="telele" id="telele" 
            pattern="(9[1236][0-9]{7}|2[0-9]{8})">
            <small class=" invisible peer-user-invalid:visible  text-red-600">Formato inválido.</small>
        </div>

        <div class="flex flex-col">
            <label for="data-nascimento">Data Nascimento</label>
            <input class="peer p-2 border" type="date" name="dataNascimento" id="data-nascimento" 
                min="2026-10-27"
                >
            <small class=" invisible peer-user-invalid:visible  text-red-600">Formato inválido.</small>
        </div>

        <div class="flex flex-col">
            <label for="cp">Código Postal</label>
            <input class="peer p-2 border" type="text" name="cp" id="cp" 
            pattern="([0-9]{4}-[0-9]{3})" autocomplete="postal-code" placeholder="1234-567"
            inputmode="numeric"
            >
            <small class=" invisible peer-user-invalid:visible  text-red-600">Formato inválido.</small>
        </div>

    </div>


    <div class="w-full sm:w-1/2 flex flex-col">
        <label for="">Seleciona a tua sessão</label>
        <select name="sessao" id="sessao" required 
        class="border p-2">
            <option value="">-- seleciona a tua sessão --</option>
            <option value="1">Sessão 1</option>
            <option value="2">Sessão 2</option>
        </select>
    </div>


    <div class="mt-4 ">
        <p class="mb-2">Já usaste um telescópio *</p>
        
        <div class="flex gap-8">
            <label class="cursor-pointer px-4 py-2 
                border border-gray-100 hover:border-rose-500 rounded
                has-checked:border-rose-500">
                <input class="appearance-none h-5 w-5 rounded border-2
                 border-gray-400
         checked:bg-blue-600 checked:border-blue-600 cursor-pointer" type="radio" name="tele" id="tele1" value="nunca" checked>&nbsp;Nunca
            </label>
           <label class="cursor-pointer px-4 py-2 
                border border-gray-100 hover:border-rose-500 rounded
                has-checked:border-rose-500">
                <input type="radio" name="tele" id="tele2" value="algumas">&nbsp;Algumas vezes
            </label>
            <label class="cursor-pointer px-4 py-2 
                border border-gray-100 hover:border-rose-500 rounded
                has-checked:border-rose-500">
                <input type="radio" name="tele" id="tele3" value="proprio">&nbsp;Tenho o meu próprio
            </label>
        </div>

         <div class="flex gap-8">
            <label class="cursor-pointer px-4 py-2 
                border border-gray-100 hover:border-rose-500 rounded
                has-checked:border-rose-500">
                <input type="checkbox" name="chk1" id="chk1" value="nunca">&nbsp;Nunca
            </label>
           <label class="cursor-pointer px-4 py-2 
                border border-gray-100 hover:border-rose-500 rounded
                has-checked:border-rose-500">
                <input type="checkbox" name="chk2" id="chk2" value="algumas">&nbsp;Algumas vezes
            </label>
            <label class="cursor-pointer px-4 py-2 
                border border-gray-100 hover:border-rose-500 rounded
                has-checked:border-rose-500">
                <input type="checkbox" name="chk3" id="chk3" value="proprio">&nbsp;Tenho o meu próprio
            </label>
        </div>

    </div>


    <div class="mt-4">
        <button class="rounded px-6 py-3 bg-orange-500 
        text-white font-semibold shadow-sm cursor-pointer
        hover:bg-orange-800 hover:scale-95 transition-colors duration-200" 
        type="submit">Enviar Dados</button>
    </div>

    </form>



</div>



</body>
</html>

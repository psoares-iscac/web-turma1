<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{box-sizing: border-box;}
        input {
            width:100%;
            padding: 0.5rem;
            border:1px solid grey;
        }

        input:user-invalid{
            border-color:red;
        }

        .ajuda{
            /*display: none;*/
            visibility:hidden;
            color:red;
            opacity:0;
            transition: opacity 0.2s;
        }

        input:user-invalid + .ajuda{
            /*display: block;*/
            visibility: visible;
            opacity:1;
        }



    </style>
</head>
<body>
    

<div style="width: 700px;margin: 4rem auto 0;border:1px solid black;padding:1rem;">
    <form action="#" method="get">
        <div class="campo">
            <label for="idnome">Nome e Sobrenome *</label>
            <input type="text" id="idnome" name="nome"
                    placeholder="Ex: Paulo Soares"
                    required minlength="5"
                    autocomplete="name"
            >
            <small class="ajuda ajuda-nome">Obrigatório, com pelo menos 5 letras.</small>
        </div>

        <div class="campo">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email"
                    placeholder="psoares@iscac.pt"
                    required 
                    autocomplete="email"
            >
            <small class="ajuda ajuda-email">Obrigatório, com email válido.</small>
        </div>

        <div class="campo">
            <label for="data-nascimento">Data de Nascimento</label>
            <input type="date" id="data-nascimento" name="data_nascimento"
            >
        </div>

        <div class="campo">
            <label for="cp">Código Postal</label>
            <input type="text" id="cp" name="cp"
                    placeholder="0000-000"
                    pattern="[0-9]{4}-[0-9]{3}"
                    autocomplete="postal-code"
            >
            <small class="ajuda ajuda-email">Tem de ser XXXX - XXX</small>
        </div>





        <div style="margin-top:1rem;" class="mt-4">
            <button type="submit">Enviar Reciclagem</button>
        </div>
    </form>
</div>


</body>
</html>
